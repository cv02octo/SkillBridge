<!DOCTYPE html>
<html>

<head>
    <title>Operating System Assessment - SkillBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>SKILLBRIDGE</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="assessment.html">Assessment</a>
        </div>
    </nav>

    <div class="test-container">

        <div class="test-header">

            <h1>Operating System Assessment</h1>

            <p>
                Question <span id="question-number">1</span> / 20
            </p>

        </div>

        <div class="test-card">

            <h2 id="question"></h2>

            <div id="options"></div>

            <div class="test-buttons">

                <button id="next-btn">Next →</button>

            </div>

        </div>

    </div>


    <script>

        const questionBank = [

            {
                question: "What does OS stand for?",
                options: [
                    "Operating System",
                    "Open Software",
                    "Operating Software",
                    "Online System"
                ],
                answer: "Operating System"
            },

            {
                question: "Which of the following is an operating system?",
                options: [
                    "Microsoft Word",
                    "Windows",
                    "Google Chrome",
                    "MySQL"
                ],
                answer: "Windows"
            },

            {
                question: "Which OS is developed by Microsoft?",
                options: [
                    "Linux",
                    "Windows",
                    "Ubuntu",
                    "Android"
                ],
                answer: "Windows"
            },

            {
                question: "Which of the following is an open-source operating system?",
                options: [
                    "Linux",
                    "Windows",
                    "macOS",
                    "MS-DOS"
                ],
                answer: "Linux"
            },

            {
                question: "What is the main function of an operating system?",
                options: [
                    "Manage computer resources",
                    "Create websites",
                    "Design images",
                    "Browse the internet"
                ],
                answer: "Manage computer resources"
            },

            {
                question: "Which component manages processes in an operating system?",
                options: [
                    "Process Manager",
                    "Compiler",
                    "Browser",
                    "Database"
                ],
                answer: "Process Manager"
            },

            {
                question: "What is a process?",
                options: [
                    "A program in execution",
                    "A file",
                    "A folder",
                    "A hardware device"
                ],
                answer: "A program in execution"
            },

            {
                question: "Which scheduling algorithm executes the process with the shortest burst time first?",
                options: [
                    "FCFS",
                    "SJF",
                    "Round Robin",
                    "Priority"
                ],
                answer: "SJF"
            },

            {
                question: "Which scheduling algorithm works on the principle of first come, first served?",
                options: [
                    "FCFS",
                    "SJF",
                    "Round Robin",
                    "Priority"
                ],
                answer: "FCFS"
            },

            {
                question: "Which scheduling algorithm uses a time quantum?",
                options: [
                    "FCFS",
                    "SJF",
                    "Round Robin",
                    "Priority"
                ],
                answer: "Round Robin"
            },

            {
                question: "What is a thread?",
                options: [
                    "Smallest unit of CPU execution",
                    "A type of memory",
                    "A hardware device",
                    "A file system"
                ],
                answer: "Smallest unit of CPU execution"
            },

            {
                question: "What is deadlock?",
                options: [
                    "Processes waiting indefinitely for resources",
                    "A type of memory",
                    "Fast execution of programs",
                    "A file management method"
                ],
                answer: "Processes waiting indefinitely for resources"
            },

            {
                question: "Which of the following is a necessary condition for deadlock?",
                options: [
                    "Mutual Exclusion",
                    "Compilation",
                    "Encryption",
                    "Paging"
                ],
                answer: "Mutual Exclusion"
            },

            {
                question: "Which memory management technique divides memory into fixed-size blocks?",
                options: [
                    "Paging",
                    "Segmentation",
                    "Scheduling",
                    "Spooling"
                ],
                answer: "Paging"
            },

            {
                question: "Which memory management technique divides memory into variable-sized segments?",
                options: [
                    "Paging",
                    "Segmentation",
                    "Caching",
                    "Spooling"
                ],
                answer: "Segmentation"
            },

            {
                question: "What is virtual memory?",
                options: [
                    "A technique that uses disk space as an extension of RAM",
                    "A type of processor",
                    "A physical memory chip",
                    "A type of operating system"
                ],
                answer: "A technique that uses disk space as an extension of RAM"
            },

            {
                question: "Which of the following is a type of system call?",
                options: [
                    "Process Control",
                    "Web Design",
                    "Image Editing",
                    "Video Streaming"
                ],
                answer: "Process Control"
            },

            {
                question: "Which device is used for secondary storage?",
                options: [
                    "Hard Disk",
                    "RAM",
                    "Cache",
                    "Register"
                ],
                answer: "Hard Disk"
            },

            {
                question: "What is a file system?",
                options: [
                    "A method of organizing and storing files",
                    "A type of CPU",
                    "A programming language",
                    "A network protocol"
                ],
                answer: "A method of organizing and storing files"
            },

            {
                question: "Which of the following is an example of a real-time operating system?",
                options: [
                    "VxWorks",
                    "Windows 10",
                    "MS Word",
                    "MySQL"
                ],
                answer: "VxWorks"
            },

            {
                question: "What is multitasking?",
                options: [
                    "Running multiple tasks apparently at the same time",
                    "Running only one program",
                    "Deleting multiple files",
                    "Installing multiple operating systems"
                ],
                answer: "Running multiple tasks apparently at the same time"
            },

            {
                question: "What is multiprocessing?",
                options: [
                    "Using multiple processors to execute processes",
                    "Using multiple files",
                    "Using multiple users",
                    "Using multiple folders"
                ],
                answer: "Using multiple processors to execute processes"
            },

            {
                question: "Which part of the OS handles communication between hardware and software?",
                options: [
                    "Kernel",
                    "Browser",
                    "Compiler",
                    "Database"
                ],
                answer: "Kernel"
            },

            {
                question: "What is the kernel?",
                options: [
                    "Core part of an operating system",
                    "A web browser",
                    "A database",
                    "A text editor"
                ],
                answer: "Core part of an operating system"
            },

            {
                question: "Which algorithm is commonly used to avoid deadlock?",
                options: [
                    "Banker's Algorithm",
                    "FCFS",
                    "Binary Search",
                    "Round Robin"
                ],
                answer: "Banker's Algorithm"
            },

            {
                question: "What is context switching?",
                options: [
                    "Switching CPU from one process to another",
                    "Changing a file name",
                    "Changing the operating system",
                    "Switching between users"
                ],
                answer: "Switching CPU from one process to another"
            },

            {
                question: "What is a semaphore?",
                options: [
                    "A synchronization mechanism",
                    "A memory device",
                    "A processor",
                    "A file system"
                ],
                answer: "A synchronization mechanism"
            },

            {
                question: "Which of the following is a CPU scheduling criterion?",
                options: [
                    "Waiting Time",
                    "File Size",
                    "Screen Resolution",
                    "Disk Capacity"
                ],
                answer: "Waiting Time"
            },

            {
                question: "What is fragmentation?",
                options: [
                    "Wasted memory space",
                    "CPU failure",
                    "Network failure",
                    "File encryption"
                ],
                answer: "Wasted memory space"
            },

            {
                question: "Which OS is commonly used in smartphones?",
                options: [
                    "Android",
                    "DOS",
                    "Unix only",
                    "Windows 95"
                ],
                answer: "Android"
            }

        ];


        function shuffle(array) {

            for (let i = array.length - 1; i > 0; i--) {

                let j = Math.floor(Math.random() * (i + 1));

                [array[i], array[j]] =
                    [array[j], array[i]];

            }

            return array;
        }


        let selectedQuestions =
            shuffle([...questionBank]).slice(0, 20);

        let currentQuestion = 0;

        let score = 0;

        let selectedAnswer = "";


        function loadQuestion() {

            let q = selectedQuestions[currentQuestion];

            document.getElementById("question-number").innerText =
                currentQuestion + 1;

            document.getElementById("question").innerText =
                q.question;

            let optionsContainer =
                document.getElementById("options");

            optionsContainer.innerHTML = "";

            selectedAnswer = "";

            let shuffledOptions =
                shuffle([...q.options]);


            shuffledOptions.forEach((option, index) => {

                let label =
                    document.createElement("label");

                label.className = "answer-option";


                let input =
                    document.createElement("input");

                input.type = "radio";

                input.name = "answer";

                input.value = option;


                let letter =
                    document.createElement("span");

                letter.className = "option-letter";

                letter.innerText =
                    String.fromCharCode(65 + index);


                let text =
                    document.createElement("span");

                text.innerText = option;


                label.appendChild(input);

                label.appendChild(letter);

                label.appendChild(text);


                label.addEventListener("click", function () {

                    document
                        .querySelectorAll(".answer-option")
                        .forEach(option =>
                            option.classList.remove("selected")
                        );

                    label.classList.add("selected");

                    selectedAnswer = option;

                });


                optionsContainer.appendChild(label);

            });

        }


        document
            .getElementById("next-btn")
            .addEventListener("click", function () {

                if (selectedAnswer === "") {

                    alert("Please select an answer.");

                    return;

                }


                if (
                    selectedAnswer ===
                    selectedQuestions[currentQuestion].answer
                ) {

                    score++;

                }


                if (currentQuestion < 19) {

                    currentQuestion++;

                    loadQuestion();

                } else {

                    localStorage.setItem(
                        "osScore",
                        score
                    );

                    window.location.href =
                        "result.html";

                }

            });


        loadQuestion();

    </script>

</body>

</html>
