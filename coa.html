<!DOCTYPE html>
<html>

<head>
    <title>Computer Organization Assessment - SkillBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>SKILLBRIDGE</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="assessment.html">Assessment</a>
        </div>
    </nav>

    <div class="test-container">

        <div class="test-header">
            <h1>Computer Organization Assessment</h1>
            <p>Question <span id="question-number">1</span> / 20</p>
        </div>

        <div class="test-card">

            <h2 id="question"></h2>

            <div id="options"></div>

            <div class="test-buttons">
                <button id="next-btn">Next →</button>
            </div>

        </div>

    </div>

    <script>

        const questionBank = [

            {
                question: "What is the main function of the CPU?",
                options: [
                    "Execute instructions",
                    "Store files permanently",
                    "Connect to the internet",
                    "Display images"
                ],
                answer: "Execute instructions"
            },

            {
                question: "Which component performs arithmetic and logical operations?",
                options: [
                    "ALU",
                    "RAM",
                    "Control Unit",
                    "Hard Disk"
                ],
                answer: "ALU"
            },

            {
                question: "What does ALU stand for?",
                options: [
                    "Arithmetic Logic Unit",
                    "Automatic Logic Unit",
                    "Arithmetic Local Unit",
                    "Advanced Logic Utility"
                ],
                answer: "Arithmetic Logic Unit"
            },

            {
                question: "Which unit controls the operations of the CPU?",
                options: [
                    "Control Unit",
                    "ALU",
                    "RAM",
                    "Cache"
                ],
                answer: "Control Unit"
            },

            {
                question: "Which memory is volatile?",
                options: [
                    "RAM",
                    "ROM",
                    "Hard Disk",
                    "SSD"
                ],
                answer: "RAM"
            },

            {
                question: "Which memory is non-volatile?",
                options: [
                    "ROM",
                    "RAM",
                    "Cache",
                    "Register"
                ],
                answer: "ROM"
            },

            {
                question: "What is a register?",
                options: [
                    "A small high-speed storage location inside the CPU",
                    "A type of hard disk",
                    "A network device",
                    "A software application"
                ],
                answer: "A small high-speed storage location inside the CPU"
            },

            {
                question: "Which register stores the address of the next instruction?",
                options: [
                    "Program Counter",
                    "Accumulator",
                    "Instruction Register",
                    "Memory Data Register"
                ],
                answer: "Program Counter"
            },

            {
                question: "Which register stores the current instruction?",
                options: [
                    "Instruction Register",
                    "Program Counter",
                    "Accumulator",
                    "Stack Pointer"
                ],
                answer: "Instruction Register"
            },

            {
                question: "What is the purpose of cache memory?",
                options: [
                    "Provide fast access to frequently used data",
                    "Store data permanently",
                    "Connect computers",
                    "Display output"
                ],
                answer: "Provide fast access to frequently used data"
            },

            {
                question: "Which is the fastest memory among these?",
                options: [
                    "Register",
                    "RAM",
                    "Hard Disk",
                    "Optical Disk"
                ],
                answer: "Register"
            },

            {
                question: "What is a bus in computer organization?",
                options: [
                    "A communication pathway",
                    "A storage device",
                    "A processor",
                    "An operating system"
                ],
                answer: "A communication pathway"
            },

            {
                question: "Which bus carries memory addresses?",
                options: [
                    "Address Bus",
                    "Data Bus",
                    "Control Bus",
                    "System Bus"
                ],
                answer: "Address Bus"
            },

            {
                question: "Which bus carries actual data?",
                options: [
                    "Data Bus",
                    "Address Bus",
                    "Control Bus",
                    "Power Bus"
                ],
                answer: "Data Bus"
            },

            {
                question: "Which bus carries control signals?",
                options: [
                    "Control Bus",
                    "Data Bus",
                    "Address Bus",
                    "Memory Bus"
                ],
                answer: "Control Bus"
            },

            {
                question: "What is an instruction cycle?",
                options: [
                    "The process of fetching and executing an instruction",
                    "The process of shutting down a computer",
                    "The process of formatting a disk",
                    "The process of installing software"
                ],
                answer: "The process of fetching and executing an instruction"
            },

            {
                question: "Which step comes first in the instruction cycle?",
                options: [
                    "Fetch",
                    "Execute",
                    "Store",
                    "Decode"
                ],
                answer: "Fetch"
            },

            {
                question: "What is an opcode?",
                options: [
                    "The part of an instruction specifying the operation",
                    "The memory address",
                    "The output value",
                    "The CPU speed"
                ],
                answer: "The part of an instruction specifying the operation"
            },

            {
                question: "What is an operand?",
                options: [
                    "The data on which an operation is performed",
                    "A CPU register only",
                    "A control signal",
                    "A memory device"
                ],
                answer: "The data on which an operation is performed"
            },

            {
                question: "Which addressing mode directly contains the operand?",
                options: [
                    "Immediate Addressing",
                    "Direct Addressing",
                    "Indirect Addressing",
                    "Indexed Addressing"
                ],
                answer: "Immediate Addressing"
            },

            {
                question: "Which addressing mode uses the address of the operand?",
                options: [
                    "Direct Addressing",
                    "Immediate Addressing",
                    "Register Addressing",
                    "Relative Addressing"
                ],
                answer: "Direct Addressing"
            },

            {
                question: "What is pipelining?",
                options: [
                    "Executing multiple instruction stages simultaneously",
                    "Increasing hard disk size",
                    "Deleting instructions",
                    "Connecting computers"
                ],
                answer: "Executing multiple instruction stages simultaneously"
            },

            {
                question: "What does RTL stand for?",
                options: [
                    "Register Transfer Language",
                    "Register Transfer Logic",
                    "Random Transfer Language",
                    "Read Transfer Logic"
                ],
                answer: "Register Transfer Language"
            },

            {
                question: "What is a micro-operation?",
                options: [
                    "A basic operation performed on data stored in registers",
                    "A type of software",
                    "A network protocol",
                    "A storage device"
                ],
                answer: "A basic operation performed on data stored in registers"
            },

            {
                question: "Which operation adds two binary numbers?",
                options: [
                    "Arithmetic operation",
                    "Logical operation",
                    "Shift operation",
                    "Control operation"
                ],
                answer: "Arithmetic operation"
            },

            {
                question: "Which operation shifts bits to the left or right?",
                options: [
                    "Shift operation",
                    "Arithmetic operation",
                    "Logical comparison",
                    "Branch operation"
                ],
                answer: "Shift operation"
            },

            {
                question: "What is the purpose of the accumulator?",
                options: [
                    "Store intermediate arithmetic and logical results",
                    "Store the operating system",
                    "Store network addresses",
                    "Display output"
                ],
                answer: "Store intermediate arithmetic and logical results"
            },

            {
                question: "What is memory hierarchy?",
                options: [
                    "Arrangement of memory according to speed, cost and capacity",
                    "Arrangement of files alphabetically",
                    "Arrangement of computers in a network",
                    "Arrangement of software applications"
                ],
                answer: "Arrangement of memory according to speed, cost and capacity"
            },

            {
                question: "Which memory is generally larger but slower than cache?",
                options: [
                    "Main Memory",
                    "Register",
                    "Cache",
                    "CPU Register"
                ],
                answer: "Main Memory"
            },

            {
                question: "What is the main purpose of an instruction register?",
                options: [
                    "Hold the instruction currently being executed",
                    "Hold the next memory address",
                    "Store permanent files",
                    "Control the monitor"
                ],
                answer: "Hold the instruction currently being executed"
            }

        ];


        function shuffle(array) {

            for (let i = array.length - 1; i > 0; i--) {

                let j = Math.floor(Math.random() * (i + 1));

                [array[i], array[j]] = [array[j], array[i]];

            }

            return array;
        }


        let selectedQuestions =
            shuffle([...questionBank]).slice(0, 20);

        let currentQuestion = 0;
        let score = 0;
        let selectedAnswer = "";


        const questionElement =
            document.getElementById("question");

        const optionsElement =
            document.getElementById("options");

        const questionNumber =
            document.getElementById("question-number");

        const nextButton =
            document.getElementById("next-btn");


        function showQuestion() {

            let q = selectedQuestions[currentQuestion];

            questionElement.innerText =
                q.question;

            questionNumber.innerText =
                currentQuestion + 1;

            optionsElement.innerHTML = "";

            selectedAnswer = "";

            let shuffledOptions =
                shuffle([...q.options]);


            shuffledOptions.forEach(function(option) {

                let label =
                    document.createElement("label");

                label.className =
                    "answer-option";


                label.innerHTML = `
                    <input type="radio" name="answer">
                    <span class="option-letter"></span>
                    <span>${option}</span>
                `;


                label.querySelector("input").value =
                    option;


                label.addEventListener("click", function() {

                    document
                        .querySelectorAll(".answer-option")
                        .forEach(function(item) {

                            item.classList.remove("selected");

                        });


                    label.classList.add("selected");

                    selectedAnswer = option;

                });


                optionsElement.appendChild(label);

            });


            let optionLetters =
                document.querySelectorAll(".option-letter");


            optionLetters.forEach(function(letter, index) {

                letter.innerText =
                    String.fromCharCode(65 + index);

            });


            if (currentQuestion === 19) {

                nextButton.innerText =
                    "Submit Assessment";

            } else {

                nextButton.innerText =
                    "Next →";

            }

        }


        nextButton.addEventListener("click", function() {

            if (selectedAnswer === "") {

                alert("Please select an answer.");

                return;

            }


            let correctAnswer =
                selectedQuestions[currentQuestion].answer;


            if (selectedAnswer === correctAnswer) {

                score++;

            }


            currentQuestion++;


            if (currentQuestion < 20) {

                showQuestion();

            } else {

                localStorage.setItem("coaScore", score);

                window.location.href =
                    "result.html";

            }

        });


        showQuestion();

    </script>

</body>

</html>
