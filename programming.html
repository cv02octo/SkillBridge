<!DOCTYPE html>
<html>

<head>
    <title>Programming Assessment - SkillBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>SKILLBRIDGE</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="assessment.html">Assessment</a>
        </div>
    </nav>

    <div class="test-container">

        <div class="test-header">
            <h1>Programming Assessment</h1>
            <p>Question <span id="question-number">1</span> / 20</p>
        </div>

        <div class="test-card">

            <h2 id="question"></h2>

            <div id="options"></div>

            <div class="test-buttons">
                <button id="next-btn">Next →</button>
            </div>

        </div>

    </div>

    <script>

        const questions = [

            {
                question: "Which of the following is a programming language?",
                options: ["HTML", "Java", "CSS", "XML"],
                answer: 1
            },

            {
                question: "Which symbol is commonly used to assign a value to a variable?",
                options: ["=", "==", "!=", ">="],
                answer: 0
            },

            {
                question: "Which data type is used to store true or false values?",
                options: ["int", "String", "boolean", "double"],
                answer: 2
            },

            {
                question: "Which loop is generally used when the number of iterations is known?",
                options: ["for loop", "while loop", "do-while loop", "switch"],
                answer: 0
            },

            {
                question: "Which keyword is used to create a class in Java?",
                options: ["object", "class", "create", "newclass"],
                answer: 1
            },

            {
                question: "Which method is the starting point of a Java program?",
                options: ["start()", "run()", "main()", "execute()"],
                answer: 2
            },

            {
                question: "Which operator is used for comparison in Java?",
                options: ["=", "==", "+=", "++"],
                answer: 1
            },

            {
                question: "Which concept allows a class to acquire properties of another class?",
                options: ["Encapsulation", "Inheritance", "Abstraction", "Compilation"],
                answer: 1
            },

            {
                question: "Which OOP concept allows the same method name to have different forms?",
                options: ["Inheritance", "Polymorphism", "Encapsulation", "Package"],
                answer: 1
            },

            {
                question: "Which keyword is used to inherit a class in Java?",
                options: ["implements", "extends", "inherits", "super"],
                answer: 1
            },

            {
                question: "Which data structure is used internally by a function call stack?",
                options: ["Queue", "Stack", "Tree", "Graph"],
                answer: 1
            },

            {
                question: "What is the average time complexity of searching in a HashMap?",
                options: ["O(n)", "O(log n)", "O(1)", "O(n²)"],
                answer: 2
            },

            {
                question: "Which keyword is used to handle exceptions in Java?",
                options: ["exception", "error", "try", "handle"],
                answer: 2
            },

            {
                question: "Which access modifier provides the widest access in Java?",
                options: ["private", "protected", "public", "default"],
                answer: 2
            },

            {
                question: "Which Java collection does not allow duplicate elements?",
                options: ["List", "Set", "ArrayList", "Vector"],
                answer: 1
            },

            {
                question: "Which technique is commonly used to reduce repeated recursive calculations?",
                options: ["Sorting", "Memoization", "Compilation", "Casting"],
                answer: 1
            },

            {
                question: "What is the time complexity of binary search on a sorted array?",
                options: ["O(n)", "O(n²)", "O(log n)", "O(1)"],
                answer: 2
            },

            {
                question: "Which principle is mainly used to hide unnecessary implementation details?",
                options: ["Inheritance", "Abstraction", "Polymorphism", "Overloading"],
                answer: 1
            },

            {
                question: "Which algorithmic technique solves a problem by breaking it into smaller subproblems?",
                options: ["Divide and Conquer", "Linear Search", "Hashing", "Traversal"],
                answer: 0
            },

            {
                question: "Which data structure is most suitable for implementing a priority queue efficiently?",
                options: ["Array", "Stack", "Heap", "Linked List"],
                answer: 2
            }

        ];

        let currentQuestion = 0;
        let selectedAnswers = [];

        const questionNumber = document.getElementById("question-number");
        const question = document.getElementById("question");
        const options = document.getElementById("options");
        const nextButton = document.getElementById("next-btn");

        function showQuestion() {

            let q = questions[currentQuestion];

            questionNumber.innerText = currentQuestion + 1;

            question.innerText = q.question;

            options.innerHTML = "";

            q.options.forEach(function(option, index) {

                let label = document.createElement("label");

                label.className = "answer-option";

                label.innerHTML =
                    '<input type="radio" name="answer">' +
                    '<span class="option-letter">' +
                    String.fromCharCode(65 + index) +
                    '</span>' +
                    '<span>' + option + '</span>';

                label.onclick = function() {

                    selectedAnswers[currentQuestion] = index;

                    let allOptions =
                        document.querySelectorAll(".answer-option");

                    allOptions.forEach(function(item) {
                        item.classList.remove("selected");
                    });

                    label.classList.add("selected");
                };

                options.appendChild(label);

            });

            if (currentQuestion === questions.length - 1) {
                nextButton.innerText = "Submit Assessment";
            } else {
                nextButton.innerText = "Next →";
            }

        }

        nextButton.onclick = function() {

            if (selectedAnswers[currentQuestion] === undefined) {

                alert("Please select an answer first.");

                return;
            }

            if (currentQuestion < questions.length - 1) {

                currentQuestion++;

                showQuestion();

            } else {

                let score = 0;

                for (let i = 0; i < questions.length; i++) {

                    if (selectedAnswers[i] === questions[i].answer) {
                        score++;
                    }

                }

                localStorage.setItem("programmingScore", score);

                window.location.href = "result.html";

            }

        };

        showQuestion();

    </script>

</body>

</html>
