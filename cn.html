<!DOCTYPE html>
<html>

<head>
    <title>Computer Networks Assessment - SkillBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>SKILLBRIDGE</h2>

        <div>
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="assessment.html">Assessment</a>
        </div>
    </nav>

    <div class="test-container">

        <div class="test-header">

            <h1>Computer Networks Assessment</h1>

            <p>
                Question <span id="question-number">1</span> / 20
            </p>

        </div>

        <div class="test-card">

            <h2 id="question"></h2>

            <div id="options"></div>

            <div class="test-buttons">

                <button id="next-btn">Next →</button>

            </div>

        </div>

    </div>


    <script>

        const questionBank = [

            {
                question: "What does LAN stand for?",
                options: [
                    "Local Area Network",
                    "Large Area Network",
                    "Long Area Network",
                    "Linked Area Network"
                ],
                answer: "Local Area Network"
            },

            {
                question: "What does WAN stand for?",
                options: [
                    "Wide Area Network",
                    "Wireless Area Network",
                    "Web Area Network",
                    "World Area Network"
                ],
                answer: "Wide Area Network"
            },

            {
                question: "Which device connects different networks?",
                options: [
                    "Router",
                    "Keyboard",
                    "Monitor",
                    "Printer"
                ],
                answer: "Router"
            },

            {
                question: "Which device is used to connect devices within a LAN?",
                options: [
                    "Switch",
                    "Router",
                    "Modem",
                    "Scanner"
                ],
                answer: "Switch"
            },

            {
                question: "What is the full form of IP?",
                options: [
                    "Internet Protocol",
                    "Internet Program",
                    "Internal Protocol",
                    "Information Protocol"
                ],
                answer: "Internet Protocol"
            },

            {
                question: "Which protocol is used to transfer web pages?",
                options: [
                    "HTTP",
                    "FTP",
                    "SMTP",
                    "POP3"
                ],
                answer: "HTTP"
            },

            {
                question: "Which protocol is used for secure web communication?",
                options: [
                    "HTTPS",
                    "HTTP",
                    "FTP",
                    "SMTP"
                ],
                answer: "HTTPS"
            },

            {
                question: "Which protocol is used to send emails?",
                options: [
                    "SMTP",
                    "HTTP",
                    "FTP",
                    "DNS"
                ],
                answer: "SMTP"
            },

            {
                question: "Which protocol is commonly used to receive emails?",
                options: [
                    "POP3",
                    "HTTP",
                    "FTP",
                    "ARP"
                ],
                answer: "POP3"
            },

            {
                question: "What is the main function of DNS?",
                options: [
                    "Convert domain names into IP addresses",
                    "Send emails",
                    "Transfer files",
                    "Encrypt passwords"
                ],
                answer: "Convert domain names into IP addresses"
            },

            {
                question: "Which layer of the OSI model is responsible for routing?",
                options: [
                    "Network Layer",
                    "Transport Layer",
                    "Session Layer",
                    "Physical Layer"
                ],
                answer: "Network Layer"
            },

            {
                question: "How many layers are there in the OSI model?",
                options: [
                    "7",
                    "5",
                    "6",
                    "8"
                ],
                answer: "7"
            },

            {
                question: "Which layer of OSI model deals with end-to-end communication?",
                options: [
                    "Transport Layer",
                    "Network Layer",
                    "Data Link Layer",
                    "Physical Layer"
                ],
                answer: "Transport Layer"
            },

            {
                question: "Which protocol provides reliable data transmission?",
                options: [
                    "TCP",
                    "UDP",
                    "IP",
                    "ARP"
                ],
                answer: "TCP"
            },

            {
                question: "Which protocol is connectionless?",
                options: [
                    "UDP",
                    "TCP",
                    "HTTP",
                    "FTP"
                ],
                answer: "UDP"
            },

            {
                question: "What is the full form of TCP?",
                options: [
                    "Transmission Control Protocol",
                    "Transfer Control Protocol",
                    "Transmission Communication Protocol",
                    "Transfer Communication Program"
                ],
                answer: "Transmission Control Protocol"
            },

            {
                question: "What is the full form of UDP?",
                options: [
                    "User Datagram Protocol",
                    "Universal Data Protocol",
                    "User Data Program",
                    "Universal Datagram Program"
                ],
                answer: "User Datagram Protocol"
            },

            {
                question: "Which address uniquely identifies a network interface?",
                options: [
                    "MAC Address",
                    "URL",
                    "Port Number",
                    "Domain Name"
                ],
                answer: "MAC Address"
            },

            {
                question: "Which protocol maps an IP address to a MAC address?",
                options: [
                    "ARP",
                    "DNS",
                    "FTP",
                    "SMTP"
                ],
                answer: "ARP"
            },

            {
                question: "What is the purpose of a firewall?",
                options: [
                    "Protect a network from unauthorized access",
                    "Increase screen brightness",
                    "Store files",
                    "Create websites"
                ],
                answer: "Protect a network from unauthorized access"
            },

            {
                question: "Which topology connects all devices to a central device?",
                options: [
                    "Star",
                    "Bus",
                    "Ring",
                    "Mesh"
                ],
                answer: "Star"
            },

            {
                question: "Which topology uses a single main cable?",
                options: [
                    "Bus",
                    "Star",
                    "Ring",
                    "Mesh"
                ],
                answer: "Bus"
            },

            {
                question: "Which topology connects each device to two other devices?",
                options: [
                    "Ring",
                    "Star",
                    "Bus",
                    "Tree"
                ],
                answer: "Ring"
            },

            {
                question: "Which topology provides a connection between every pair of devices?",
                options: [
                    "Mesh",
                    "Bus",
                    "Star",
                    "Ring"
                ],
                answer: "Mesh"
            },

            {
                question: "What is bandwidth?",
                options: [
                    "Maximum data transfer capacity of a network",
                    "Network address",
                    "Type of cable",
                    "Security protocol"
                ],
                answer: "Maximum data transfer capacity of a network"
            },

            {
                question: "What is a packet?",
                options: [
                    "A small unit of data transmitted over a network",
                    "A network device",
                    "A type of cable",
                    "A computer program"
                ],
                answer: "A small unit of data transmitted over a network"
            },

            {
                question: "Which protocol is used for file transfer?",
                options: [
                    "FTP",
                    "SMTP",
                    "HTTP",
                    "DNS"
                ],
                answer: "FTP"
            },

            {
                question: "What is a port number used for?",
                options: [
                    "Identifying a specific application or service",
                    "Identifying a computer monitor",
                    "Increasing internet speed",
                    "Storing files"
                ],
                answer: "Identifying a specific application or service"
            },

            {
                question: "Which protocol automatically assigns IP addresses to devices?",
                options: [
                    "DHCP",
                    "DNS",
                    "HTTP",
                    "ARP"
                ],
                answer: "DHCP"
            },

            {
                question: "Which device converts digital signals to analog signals and vice versa?",
                options: [
                    "Modem",
                    "Switch",
                    "Router",
                    "Hub"
                ],
                answer: "Modem"
            }

        ];


        function shuffle(array) {

            for (let i = array.length - 1; i > 0; i--) {

                let j =
                    Math.floor(Math.random() * (i + 1));

                [array[i], array[j]] =
                    [array[j], array[i]];

            }

            return array;
        }


        let selectedQuestions =
            shuffle([...questionBank]).slice(0, 20);

        let currentQuestion = 0;

        let score = 0;

        let selectedAnswer = "";


        function loadQuestion() {

            let q =
                selectedQuestions[currentQuestion];

            document.getElementById("question-number").innerText =
                currentQuestion + 1;

            document.getElementById("question").innerText =
                q.question;

            let optionsContainer =
                document.getElementById("options");

            optionsContainer.innerHTML = "";

            selectedAnswer = "";

            let shuffledOptions =
                shuffle([...q.options]);


            shuffledOptions.forEach((option, index) => {

                let label =
                    document.createElement("label");

                label.className =
                    "answer-option";


                let input =
                    document.createElement("input");

                input.type = "radio";

                input.name = "answer";

                input.value = option;


                let letter =
                    document.createElement("span");

                letter.className =
                    "option-letter";

                letter.innerText =
                    String.fromCharCode(65 + index);


                let text =
                    document.createElement("span");

                text.innerText = option;


                label.appendChild(input);

                label.appendChild(letter);

                label.appendChild(text);


                label.addEventListener("click", function () {

                    document
                        .querySelectorAll(".answer-option")
                        .forEach(option =>
                            option.classList.remove("selected")
                        );

                    label.classList.add("selected");

                    selectedAnswer = option;

                });


                optionsContainer.appendChild(label);

            });

        }


        document
            .getElementById("next-btn")
            .addEventListener("click", function () {

                if (selectedAnswer === "") {

                    alert("Please select an answer.");

                    return;

                }


                if (
                    selectedAnswer ===
                    selectedQuestions[currentQuestion].answer
                ) {

                    score++;

                }


                if (currentQuestion < 19) {

                    currentQuestion++;

                    loadQuestion();

                } else {

                    localStorage.setItem(
                        "cnScore",
                        score
                    );

                    window.location.href =
                        "result.html";

                }

            });


        loadQuestion();

    </script>

</body>

</html>
