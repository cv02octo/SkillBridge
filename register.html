<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - SkillBridge</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <a href="index.html" class="nav-brand">
            <img src="logo.png" alt="SkillBridge Logo" class="brand-logo-img">
            <span>SkillBridge</span>
        </a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="subject.html">Assessments</a>
            <a href="roadmap.html">Roadmaps</a>
            <a href="dashboard.html">Dashboard</a>
        </div>

        <div class="nav-actions">
            <a href="login.html" class="nav-btn-secondary">Sign In</a>
        </div>
    </nav>

    <!-- AUTH PAGE -->
    <div class="auth-page">
        <div class="auth-card" style="max-width: 480px;">
            <div class="auth-header">
                <a href="index.html" class="nav-brand" style="justify-content: center; margin-bottom: 16px;">
                    <div class="nav-logo-icon">
                        <i class="fa-solid fa-graduation-cap"></i>
                    </div>
                    <span>SkillBridge</span>
                </a>
                <h1>Create Free Account</h1>
                <p>Join thousands of learners building engineering skills today.</p>
            </div>

            <form action="dashboard.html" method="GET">
                <div class="form-group">
                    <label for="fullname"><i class="fa-regular fa-user"></i> Full Name</label>
                    <input type="text" id="fullname" placeholder="John Doe" required>
                </div>

                <div class="form-group">
                    <label for="reg-email"><i class="fa-regular fa-envelope"></i> Email Address</label>
                    <input type="email" id="reg-email" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="reg-password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="reg-password" placeholder="Create a strong password" required>
                </div>

                <div class="form-group">
                    <label for="primary-skill"><i class="fa-solid fa-laptop-code"></i> Target Skill Domain</label>
                    <select id="primary-skill" style="width: 100%; padding: 14px 18px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 15px; background: var(--bg-main); outline: none;">
                        <option>Data Structures & Algorithms</option>
                        <option>Web Development (Full Stack)</option>
                        <option>Database Management (DBMS)</option>
                        <option>Artificial Intelligence & ML</option>
                        <option>Cloud Computing</option>
                        <option>Cyber Security</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Create Account <i class="fa-solid fa-user-plus"></i>
                </button>
            </form>

            <div class="auth-footer">
                <p>Already have an account? <a href="login.html" style="font-weight: 700;">Sign In</a></p>
                <p style="margin-top: 10px;"><a href="index.html" style="color: var(--text-muted);"><i class="fa-solid fa-house"></i> Return to Homepage</a></p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
